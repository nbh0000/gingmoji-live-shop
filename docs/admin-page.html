  <label class="field" style="margin-top:12px"><span>본문</span><textarea name="content" style="min-height:60dvh;font-size:14px;line-height:1.6">## 제1조 (목적)
이 약관은 {{상호}}(이하 &#34;회사&#34;)가 운영하는 온라인 주문 사이트(이하 &#34;사이트&#34;)에서 제공하는 서비스의 이용 조건 및 절차, 회사와 이용자의 권리·의무 및 책임사항을 규정함을 목적으로 합니다.

## 제2조 (정의)
&#34;이용자&#34;란 사이트에 접속하여 이 약관에 따라 회사가 제공하는 서비스를 받는 회원을 말합니다.
&#34;회원&#34;이란 사이트에 회원 정보를 제공하여 회원 등록을 한 자를 말합니다.

## 제3조 (서비스의 제공)
회사는 유튜브 라이브 방송 중 소개되는 상품의 주문·결제 서비스를 제공합니다. 상품 주문은 방송 진행 중에만 가능합니다.

## 제4조 (회원가입)
이용자는 회사가 정한 양식에 따라 회원 정보를 기입하거나 카카오·구글 계정으로 회원가입을 신청할 수 있습니다. 주문을 위해서는 회원가입이 필요합니다.

## 제5조 (주문 및 결제)
이용자는 사이트에서 상품을 선택하고 배송방식(바로배송/킵)과 결제수단(카드결제/계좌이체)을 선택하여 주문합니다.
카드결제는 정해진 시간 안에 결제가 완료되지 않으면 주문이 자동 취소됩니다.
계좌이체는 안내된 계좌로 입금이 확인된 후 결제완료로 처리되며, 정해진 기한까지 입금되지 않으면 주문이 취소될 수 있습니다.

## 제6조 (킵 서비스)
&#34;킵&#34;은 결제한 상품을 회사가 보관하고, 회원이 출고를 요청할 때 모아서 발송하는 서비스입니다.
출고 요청 시 보관 중인 상품금액 합계가 무료배송 기준 미만이면 배송비가 부과됩니다.

## 제7조 (포인트)
포인트는 회사가 정한 기준에 따라 적립되며, 적립 대상 주문이 취소되면 적립된 포인트는 회수됩니다. 포인트 사용 조건은 사이트에 안내된 기준을 따릅니다.

## 제8조 (청약철회 등)
청약철회, 교환 및 환불에 관한 사항은 사이트의 &#34;교환·환불 정책&#34;을 따릅니다.

## 제9조 (개인정보보호)
회사는 이용자의 개인정보를 &#34;개인정보처리방침&#34;에 따라 보호합니다.

## 제10조 (분쟁 해결)
회사와 이용자 간 발생한 분쟁에 관한 소송은 민사소송법상의 관할법원에 제기합니다.

부칙: 이 약관은 사이트 공개일부터 시행합니다.</textarea>
